services:
  # Backend API Service
  - type: web
    name: itda-backend
    runtime: node
    repo: https://github.com/YOUR_GITHUB_USERNAME/itda-mern-project
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: web
    name: itda-frontend
    runtime: static
    repo: https://github.com/YOUR_GITHUB_USERNAME/itda-mern-project
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html