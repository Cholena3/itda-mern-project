services:
  # Backend API Service
  - type: web
    name: itda-backend
    runtime: node
    repo: https://github.com/YOUR_GITHUB_USERNAME/ITDA-MERN
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health
    region: oregon

  # Frontend Static Site
  - type: static
    name: itda-frontend
    repo: https://github.com/YOUR_GITHUB_USERNAME/ITDA-MERN
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://itda-backend.onrender.com
      - key: REACT_APP_SOCKET_URL
        value: https://itda-backend.onrender.com